apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-demo-api-blue
  namespace: harness-demo-production
  labels:
    app: harness-demo-api
    version: blue
    team: platform
    app.kubernetes.io/name: harness-demo-api
    app.kubernetes.io/version: blue
    app.kubernetes.io/managed-by: harness
  annotations:
    # slot ativo no blue-green — alterado pelo pipeline de CD
    deployment.kubernetes.io/slot: blue
    deployment.harness.io/pipeline-id: cd_blue_green_deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: harness-demo-api
      version: blue
  # rolagem zero-downtime dentro do slot
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: harness-demo-api
        version: blue
        team: platform
      annotations:
        # força restart quando configmap muda
        checksum/config: "placeholder-atualizado-pelo-harness"
    spec:
      # não roda como root — uid 10001 igual ao Dockerfile
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: leandroninja/harness-demo-api:blue
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: PORT
              value: "8080"
            - name: SLOT
              value: "blue"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          # limits bem definidos pra evitar noisy neighbor
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # readiness probe — tráfego só vai pro pod quando estiver pronto
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          # liveness probe — k8s reinicia o pod se ficar unhealthy
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
          # startup probe pra apps que demoram pra subir
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 12
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      # spread across nodes pra HA
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: harness-demo-api
              version: blue
      terminationGracePeriodSeconds: 30
